<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AlluSkyRocketStocks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B0B0D; --panel:#141417; --panel2:#1A1A1E;
    --ink:#F5F5F0; --sec:#A8A8A0; --hair:#2A2A30;
    --amber:#FFB224; --amber-dim:rgba(255,178,36,.14);
    --green:#3DDC84; --green-dim:rgba(61,220,132,.12);
    --red:#FF5C5C;  --red-dim:rgba(255,92,92,.10);
    --blue:#4FA8FF; --blue-dim:rgba(79,168,255,.14);
    --violet:#B98CFF; --violet-dim:rgba(185,140,255,.14);
    --mono:'IBM Plex Mono',ui-monospace,monospace;
    --grot:'Space Grotesk',system-ui,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--ink);font-family:var(--grot);
       font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1240px;margin:0 auto;padding:0 28px 96px}
  .num{font-family:var(--mono);font-variant-numeric:tabular-nums}
  .up{color:var(--green)} .down{color:var(--red)} .acc{color:var(--amber)}

  header{display:flex;align-items:baseline;justify-content:space-between;
         padding:26px 0 18px;border-bottom:1px solid var(--hair);flex-wrap:wrap;gap:12px}
  .brand{font-weight:700;letter-spacing:.05em;font-size:16px}
  .brand span{color:var(--sec);font-weight:400}
  .hdr-right{display:flex;align-items:baseline;gap:28px}
  .toggle button{background:none;border:none;color:var(--sec);padding:4px 14px;cursor:pointer;
       font-family:var(--mono);font-size:13px;letter-spacing:.12em;border-bottom:2px solid transparent}
  .toggle button.on{color:var(--ink);border-bottom-color:var(--amber)}
  .stamp{font-family:var(--mono);font-size:11px;color:var(--sec)}

  .lbl{font-family:var(--mono);font-size:11px;letter-spacing:.18em;color:var(--sec);
       text-transform:uppercase;margin:42px 0 14px;display:flex;gap:14px;align-items:baseline}
  .lbl .meta{color:var(--sec);opacity:.8;letter-spacing:.06em}

  /* ---------- primary candidate ---------- */
  .primary{border:1px solid var(--hair);background:var(--panel);padding:26px 28px;
           display:grid;grid-template-columns:auto 1fr auto;gap:32px;align-items:center}
  .primary .tick{font-family:var(--mono);font-size:38px;font-weight:600}
  .primary .tick small{display:block;font-size:11px;color:var(--sec);letter-spacing:.16em;
                       text-transform:uppercase;margin-top:4px;font-family:var(--grot)}
  .pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(108px,1fr));gap:18px}
  .stat b{display:block;font-family:var(--mono);font-size:17px;font-weight:500}
  .stat span{font-size:10px;color:var(--sec);letter-spacing:.1em;text-transform:uppercase}
  .rsmeter{grid-column:1/-1;height:3px;background:var(--hair);position:relative;margin-top:4px}
  .rsmeter i{position:absolute;inset:0 auto 0 0;background:var(--amber)}
  .ptrigger{font-family:var(--mono);font-size:12px;color:var(--amber);text-align:right;letter-spacing:.1em}
  .empty{border:1px solid var(--hair);padding:36px 28px;color:var(--sec);
         font-family:var(--mono);font-size:13px;background:var(--panel)}

  /* ---------- filter bar ---------- */
  .fbar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin-bottom:8px}
  .fbar .grp{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .fbar label{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--sec);
              text-transform:uppercase}
  select,input[type=number]{background:var(--panel);border:1px solid var(--hair);color:var(--ink);
       font-family:var(--mono);font-size:12px;padding:7px 10px;outline:none;width:88px}
  select{width:auto}
  select:focus,input:focus{border-color:var(--sec)}
  .btn{background:var(--panel);border:1px solid var(--hair);color:var(--sec);cursor:pointer;
       font-family:var(--mono);font-size:11px;letter-spacing:.12em;padding:8px 14px;text-transform:uppercase}
  .btn:hover{color:var(--ink);border-color:var(--sec)}
  .btn.on{color:#0B0B0D;font-weight:600}
  .btn.on.f-all{background:var(--ink);border-color:var(--ink)}
  .btn.on.f-win{background:var(--green);border-color:var(--green)}
  .btn.on.f-TRENDING{background:var(--amber);border-color:var(--amber)}
  .btn.on.f-FADING{background:var(--red);border-color:var(--red)}
  .btn.on.f-WATCHING{background:var(--blue);border-color:var(--blue)}
  .btn.on.f-today{background:var(--violet);border-color:var(--violet)}
  .btn.on.f-live{background:var(--violet);border-color:var(--violet)}
  .btn.on.f-chk{background:var(--panel2);color:var(--green);border-color:var(--green)}
  /* Losers is an outline, not a solid: FADING already owns solid red, and these
     two tabs mean different things (FADING is a subset of what is losing). */
  .btn.on.f-lose{background:var(--red-dim);border-color:var(--red);color:var(--red)}
  .btn.on.f-grp{background:var(--panel2);color:var(--blue);border-color:var(--blue)}
  .showing{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--sec);letter-spacing:.1em}

  /* ---------- badges ---------- */
  .bdg{font-family:var(--mono);font-size:9px;letter-spacing:.12em;padding:3px 7px;
       margin-left:8px;vertical-align:2px;font-weight:600}
  .b-new{color:var(--green);border:1px solid var(--green)}
  .b-dup{color:var(--sec);border:1px solid var(--hair);cursor:help}
  .b-live{color:var(--violet);border:1px solid var(--violet);background:var(--violet-dim);cursor:help}
  .b-TRENDING{background:var(--amber);color:#0B0B0D}
  .b-WATCHING{color:var(--blue);border:1px solid var(--blue);background:var(--blue-dim)}
  .b-FADING{color:var(--red);border:1px solid var(--red)}

  /* ---------- table ---------- */
  table{width:100%;border-collapse:collapse}
  thead th{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--sec);
       text-transform:uppercase;text-align:right;padding:12px;cursor:pointer;
       border-bottom:1px solid var(--hair);user-select:none;white-space:nowrap}
  thead th:first-child{text-align:left}
  thead th.sorted{color:var(--amber)}
  tbody td{font-family:var(--mono);font-size:13.5px;text-align:right;padding:13px 12px;
       border-bottom:1px solid var(--hair);white-space:nowrap}
  tbody td:first-child{text-align:left}
  tbody tr{cursor:pointer}
  tbody tr:hover td{background:var(--panel)}
  tbody tr.sel td{background:var(--amber-dim)}
  .tick-cell{font-weight:600;font-size:15px;letter-spacing:.04em}
  .sub{color:var(--sec);font-size:11.5px}
  .chk{color:var(--green)} .x{color:var(--red)}

  /* ---------- month cohorts ---------- */
  tbody tr.mhdr{cursor:pointer}
  tbody tr.mhdr td{text-align:left;padding:14px 12px 10px;background:var(--panel2);
       border-bottom:1px solid var(--hair);border-top:1px solid var(--hair);
       font-family:var(--mono);font-size:11px;letter-spacing:.12em;
       text-transform:uppercase;color:var(--sec);white-space:normal}
  tbody tr.mhdr:hover td{background:var(--panel)}
  .mchev{display:inline-block;width:15px;color:var(--sec)}
  .mname{color:var(--ink);font-weight:600;margin-right:18px;letter-spacing:.14em}
  .mstat{margin-right:15px}
  .mwarn{margin-right:15px;color:var(--amber);cursor:help;border-bottom:1px dotted var(--amber)}
  .mcold{margin-right:15px;color:var(--sec);cursor:help;border-bottom:1px dotted var(--hair)}
  .mcard{cursor:pointer;background:var(--panel2);border:1px solid var(--hair);
         padding:12px 14px;font-family:var(--mono);font-size:11px;letter-spacing:.12em;
         text-transform:uppercase;color:var(--sec)}
  .mcard .mname{margin-right:12px}

  /* ---------- detail (modal) ---------- */
  .dback{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(2px);
         z-index:90;display:none}
  .dback.on{display:block}
  .detail{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
          width:min(680px,calc(100vw - 24px));max-height:min(86vh,860px);overflow-y:auto;
          border:1px solid var(--hair);background:var(--panel);padding:24px 28px;
          z-index:100;display:none;border-radius:10px;box-shadow:0 24px 64px rgba(0,0,0,.6)}
  .detail.on{display:block}
  .detail h3{font-family:var(--mono);font-size:20px;font-weight:600;margin-bottom:18px;padding-right:40px}
  .detail h3 em{font-style:normal;color:var(--sec);font-size:12px;margin-left:14px;font-weight:400}
  .dclose{position:absolute;top:14px;right:16px;background:none;border:1px solid var(--hair);
          color:var(--sec);font-size:16px;line-height:1;padding:6px 10px;border-radius:6px;cursor:pointer}
  .dclose:hover{color:var(--ink);border-color:var(--sec)}
  .dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:18px 24px}
  .stat .num{overflow-wrap:anywhere;word-break:break-word}
  .stat.wide{grid-column:1/-1}
  .stat.wide .num{font-size:12px;line-height:1.6}
  .shist{display:flex;flex-wrap:wrap;gap:6px;margin:-6px 0 16px}
  .schip{font-family:var(--mono);font-size:11px;padding:3px 8px;border-radius:4px;
         border:1px solid var(--hair);color:var(--sec)}
  .schip.h2{border-color:var(--violet);color:var(--violet);background:var(--violet-dim)}
  .schip.h4{background:var(--violet);color:#0B0B0D;border-color:var(--violet)}
  .schip.on{box-shadow:0 0 0 1px var(--green) inset;color:var(--green)}
  .schip.on.h2{color:var(--violet)}
  .schip.on.h4{color:#0B0B0D}
  .schip.on::after{content:'';display:inline-block;width:5px;height:5px;border-radius:50%;
                    background:var(--green);margin-left:5px;vertical-align:middle}
  .risk-lo{color:var(--green)} .risk-mid{color:var(--amber)} .risk-hi{color:var(--red)}
  .rgm{display:flex;align-items:center;gap:12px;flex-wrap:wrap;border:1px solid var(--hair);
       border-radius:8px;padding:11px 14px;margin:0 0 18px;background:var(--panel)}
  .rgm-tag{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.08em;
           padding:3px 9px;border-radius:4px}
  .rgm-on{color:#0B0B0D;background:var(--green)}
  .rgm-mid{color:#0B0B0D;background:var(--amber)}
  .rgm-off{color:#0B0B0D;background:var(--red)}
  .rgm-unk{color:var(--sec);border:1px solid var(--hair)}
  .rgm-txt{font-size:12.5px;color:var(--sec);line-height:1.5}
  .plan{margin:18px 0 4px;border:1px solid var(--hair);border-radius:8px;padding:14px 16px;background:var(--panel2)}
  .plan-h{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;
          color:var(--sec);margin-bottom:12px}
  .plan-row{padding:10px 0;border-top:1px solid var(--hair)}
  .plan-row:first-of-type{border-top:none;padding-top:0}
  .plan-name{font-size:12.5px;color:var(--ink);margin-bottom:4px}
  .plan-nums{font-family:var(--mono);font-size:14px;display:flex;flex-wrap:wrap;gap:14px;align-items:baseline}
  .plan-note{margin-top:5px;line-height:1.5}
  .spark{width:100%;height:120px;display:block;margin:10px 0 16px;background:#0d0d0d;border:1px solid #222;border-radius:6px}
  .sline{fill:none;stroke-width:2}.sline.up{stroke:#2ecc71}.sline.down{stroke:#e74c3c}
  .sdot.up{fill:#2ecc71}.sdot.down{fill:#e74c3c}
  .sl{stroke-width:1;stroke-dasharray:4 4}.sl.sbox{stroke:#f0a500;opacity:.55}.sl.sstop{stroke:#e74c3c;opacity:.7}
  .slt{font-size:9px;font-family:inherit}.slt.sbox{fill:#f0a500}.slt.sstop{fill:#e74c3c}
  .sltbg{fill:#0d0d0d;opacity:.82}
  .links{margin-top:20px;display:flex;gap:24px}
  .links a{color:var(--sec);font-family:var(--mono);font-size:12px;text-decoration:none;
           border-bottom:1px solid var(--hair);padding-bottom:2px}
  .links a:hover{color:var(--amber);border-bottom-color:var(--amber)}
  .sizing{margin-top:20px;padding-top:16px;border-top:1px solid var(--hair);
          font-family:var(--mono);font-size:12px;color:var(--sec)}
  .sizing b{color:var(--ink)}

  /* ---------- positions / edge ---------- */
  .strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
  .pos{border:1px solid var(--hair);background:var(--panel);padding:18px 20px}
  .pos .t{font-family:var(--mono);font-size:16px;font-weight:600;margin-bottom:10px}
  .pos .row{display:flex;justify-content:space-between;font-family:var(--mono);
            font-size:12px;color:var(--sec);padding:3px 0}
  .pos .row b{color:var(--ink);font-weight:400}
  .edge{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;
        background:var(--hair);border:1px solid var(--hair)}
  .edge .cell{background:var(--panel);padding:20px}
  .edge b{display:block;font-family:var(--mono);font-size:24px;font-weight:600}
  .edge span{font-size:10px;color:var(--sec);letter-spacing:.12em;text-transform:uppercase}
  .note{font-family:var(--mono);font-size:11px;color:var(--sec);margin-top:12px}

  /* ---------- expectancy verdict ---------- */
  .ptrigger.pv-paper{color:var(--red)}
  .ptrigger.pv-live{color:var(--green)}
  .ptrigger.pv-unproven{color:var(--sec)}
  .pverdict{grid-column:1/-1;border-top:1px solid var(--hair);margin-top:4px;padding-top:14px;
            font-size:12.5px;line-height:1.55;color:var(--sec)}
  .pverdict b{font-family:var(--mono);font-weight:600}
  .pverdict.pv-paper b{color:var(--red)}
  .pverdict.pv-live b{color:var(--green)}
  .pverdict.pv-unproven b{color:var(--amber)}

  /* ---------- staleness ---------- */
  .stale{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;
         margin-bottom:10px;font-size:12.5px;line-height:1.5}
  .stale-warn{border:1px solid var(--amber);background:var(--amber-dim);color:var(--sec)}
  .stale-bad{border:1px solid var(--red);background:var(--red-dim);color:var(--sec)}
  .stale b{font-family:var(--mono);color:var(--ink);font-weight:600}

  /* ---------- month edge table ---------- */
  .mwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .mtbl{width:100%;border-collapse:collapse;margin-top:18px;min-width:420px}
  .mtbl th{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--sec);
       text-transform:uppercase;text-align:right;padding:10px 12px;
       border-bottom:1px solid var(--hair);white-space:nowrap}
  .mtbl th:first-child{text-align:left}
  .mtbl td{font-family:var(--mono);font-size:13px;text-align:right;padding:11px 12px;
       border-bottom:1px solid var(--hair);white-space:nowrap}
  .mtbl td:first-child{text-align:left;color:var(--ink)}
  .mtbl tr.pend td{color:var(--sec)}
  .gate-none{color:var(--sec);font-size:10px;letter-spacing:.1em}
  .gate-mixed{color:var(--amber);font-size:10px;letter-spacing:.1em;cursor:help}
  .gate-all{color:var(--sec);font-size:10px;letter-spacing:.1em;opacity:.6}

  footer{margin-top:72px;padding-top:20px;border-top:1px solid var(--hair);
         font-family:var(--mono);font-size:11px;color:var(--sec);
         display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}

  /* ---------- mobile cards ---------- */
  .cards{display:none;flex-direction:column;gap:10px}
  .card{border:1px solid var(--hair);background:var(--panel);padding:14px 16px;cursor:pointer}
  .card.sel{background:var(--amber-dim)}
  .card .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
  .card .tk{font-family:var(--mono);font-size:17px;font-weight:600}
  .card .g{font-family:var(--mono);font-size:17px;font-weight:600}
  .card .rows{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;
              font-family:var(--mono);font-size:12px;color:var(--sec)}
  .card .rows b{color:var(--ink);font-weight:400}

  @media(max-width:780px){
    .wrap{padding:0 14px 64px}
    .primary{grid-template-columns:1fr;gap:18px}
    .ptrigger{text-align:left}
    .primary .tick{font-size:30px}
    table{display:none}
    .cards{display:flex}
    .showing{margin-left:0;width:100%}
    .hdr-right{width:100%;justify-content:space-between}
  }
  @media(prefers-reduced-motion:no-preference){.rsmeter i{transition:width .6s ease}}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">ALLUSKYROCKETSTOCKS <span>/ signal terminal</span></div>
    <div class="hdr-right">
      <div class="toggle">
        <button id="tgUS" class="on" onclick="setMarket('US')">US</button>
        <button id="tgIN" onclick="setMarket('IN')">INDIA</button>
        <button id="tgCA" onclick="setMarket('CA')">CANADA</button>
      </div>
      <div class="stamp" id="stamp">—</div>
    </div>
  </header>

  <div id="stale"></div>
  <div id="regime"></div>
  <div class="lbl">Primary candidate <span class="meta" id="pmeta"></span></div>
  <div id="primary"></div>

  <div class="lbl">Signal watchlist <span class="meta" id="wmeta"></span></div>

  <div class="fbar">
    <div class="grp"><label>Sort</label>
      <select id="fSort">
        <option value="age_days">Age</option>
        <option value="gain_pct">Gain</option>
        <option value="streak">Streak</option>
        <option value="rs_pct">RS %</option>
        <option value="scan_date">Date</option>
        <option value="vol_ratio">Vol ×</option>
        <option value="risk_pct">Risk %</option>
        <option value="entry_risk_now">Risk now</option>
      </select>
      <button class="btn" id="fDir" onclick="flipDir()">↓</button>
    </div>
    <div class="grp" id="statusBtns">
      <button class="btn f-today" data-st="TODAY">Today 🎯</button>
      <button class="btn f-live" data-st="LIVE">Live ⚡</button>
      <button class="btn f-all on" data-st="ALL">All</button>
      <button class="btn f-TRENDING" data-st="TRENDING">Trending</button>
      <button class="btn f-FADING" data-st="FADING">Fading</button>
      <button class="btn f-WATCHING" data-st="WATCHING">Watching</button>
      <button class="btn f-win" data-st="WINNERS">Winners ★</button>
      <button class="btn f-lose" data-st="LOSERS">Losers ▼</button>
    </div>
  </div>
  <div class="fbar">
    <div class="grp"><label>Streak ≥</label><input type="number" id="fStreak" min="0" placeholder="0"></div>
    <div class="grp"><label>Age</label>
      <input type="number" id="fAgeMin" min="0" placeholder="min" style="width:64px">
      <span class="sub">–</span>
      <input type="number" id="fAgeMax" min="0" placeholder="max" style="width:64px">
      <label>d</label></div>
    <div class="grp"><label>Gain</label>
      <input type="number" id="fGainMin" placeholder="min" style="width:64px">
      <span class="sub">–</span>
      <input type="number" id="fGainMax" placeholder="max" style="width:64px">
      <label>%</label></div>
    <button class="btn f-chk" id="fVolT" onclick="toggleChk('fVolT')">Vol ✓ today</button>
    <button class="btn f-chk" id="fBoxT" onclick="toggleChk('fBoxT')">Box ✓ today</button>
    <button class="btn f-grp" id="fGroup" onclick="toggleGroup()">Group by month</button>
    <button class="btn" onclick="clearFilters()">Clear</button>
    <div class="showing" id="count"></div>
  </div>

  <table>
    <thead><tr id="thead"></tr></thead>
    <tbody id="tbody"></tbody>
  </table>
  <div class="cards" id="cards"></div>
  <div class="dback" id="dback" onclick="select(SELECTED)"></div>
  <div class="detail" id="detail"></div>

  <div class="lbl">Open positions</div>
  <div class="strip" id="positions"></div>

  <div class="lbl">Edge report <span class="meta">measured outcomes, not opinions</span></div>
  <div id="edge"></div>

  <footer>
    <div>Darvas trigger · trend-gated · RS-ranked · 2% risk rule</div>
    <div>The journal is the discipline. The dashboard is just the tool.</div>
  </footer>
</div>

<script>
let DATA=null, MARKET='US', DIR=-1, STATUS='ALL', SELECTED=null;
// Month grouping is opt-in. Left always-on it would silently reorder the table
// (months first, sort key second), and collapsing by default would hide the
// oldest signals -- which under the two-tier retention rule are old precisely
// BECAUSE they are still trending. So: off by default, nothing collapsed.
let GROUP=false;
const COLLAPSED=new Set();
const WINNER_FLOOR=5;   // % -- Winners held 62% of all signals at >0; a tab
                        // that wide is a second All tab, not a shortlist.
const ACCOUNT={US:1800, IN:25000};
const fmt=(v,d=2)=>v==null?'—':Number(v).toFixed(d);
// The date the LOADED DATA was stamped with (UTC), not the browser's clock.
// Bug this fixes: the old helper used new Date().toISOString(), which is
// always UTC. The scanner stamps scan_date in UTC too, so they agreed — until
// the viewer's local evening. From 5pm Pacific onward UTC has already rolled
// to tomorrow, so the browser asked for tomorrow's signals, found none, and
// every evening the primary panel read "No qualified breakouts" and the NEW
// badges vanished, while that day's scan sat right there in the table.
// Deriving the date from the payload takes the browser clock out of the
// comparison entirely, so it behaves identically in any timezone.
const dataDate=()=>(DATA&&DATA.generated)?DATA.generated.slice(0,10)
                                         :new Date().toISOString().slice(0,10);

const COLS=[
  {k:'ticker',label:'Ticker'},
  {k:'price',label:'Breakout'},
  {k:'now_price',label:'Now'},
  {k:'gain_pct',label:'Gain'},
  {k:'age_days',label:'Age'},
  {k:'streak',label:'Streak'},
  {k:'rs_pct',label:'RS %'},
  {k:'box_bottom_now',label:'Box @ now → Stop'},
  {k:'box_today',label:'Today'},
];

async function load(){
  try{
    const r=await fetch('data.json?'+Date.now());
    DATA=await r.json();
    document.getElementById('stamp').textContent=
      'scan '+DATA.generated.replace('T',' ').slice(0,16)+' UTC';
    render();
  }catch(e){
    document.getElementById('primary').innerHTML=
      '<div class="empty">data.json not found. Run the workflow once, or serve via http (not file://).</div>';
  }
}
function mkt(){
  return DATA.markets[MARKET] || {signals:[], positions:[], currency:'', label:MARKET, edge:null};
}
function cur(){return mkt().currency;}
function riskClass(p){return p==null?'':p<=6?'risk-lo':p<=12?'risk-mid':'risk-hi';}

function setMarket(m){
  MARKET=m; SELECTED=null;
  document.getElementById('tgUS').classList.toggle('on',m==='US');
  document.getElementById('tgIN').classList.toggle('on',m==='IN');
  document.getElementById('tgCA').classList.toggle('on',m==='CA');
  render();
}
function flipDir(){DIR=-DIR;document.getElementById('fDir').textContent=DIR<0?'↓':'↑';renderTable();}
function toggleChk(id){document.getElementById(id).classList.toggle('on');renderTable();}
function clearFilters(){
  ['fStreak','fAgeMin','fAgeMax','fGainMin','fGainMax'].forEach(i=>document.getElementById(i).value='');
  ['fVolT','fBoxT'].forEach(i=>document.getElementById(i).classList.remove('on'));
  STATUS='ALL'; syncStatusBtns(); document.getElementById('fSort').value='age_days';
  DIR=-1; document.getElementById('fDir').textContent='↓'; renderTable();
}
function syncStatusBtns(){
  document.querySelectorAll('#statusBtns .btn').forEach(b=>
    b.classList.toggle('on',b.dataset.st===STATUS));
}
document.getElementById('statusBtns').addEventListener('click',e=>{
  const b=e.target.closest('.btn'); if(!b)return;
  STATUS=b.dataset.st;
  if(STATUS==='WINNERS'){document.getElementById('fSort').value='gain_pct';DIR=-1;document.getElementById('fDir').textContent='↓';}
  if(STATUS==='TODAY'){document.getElementById('fSort').value='entry_risk_now';DIR=1;document.getElementById('fDir').textContent='↑';}
  if(STATUS==='LIVE'){document.getElementById('fSort').value='rs_pct';DIR=-1;document.getElementById('fDir').textContent='↓';}
  if(STATUS==='LOSERS'){document.getElementById('fSort').value='gain_pct';DIR=1;document.getElementById('fDir').textContent='↑';}
  syncStatusBtns(); renderTable();
});

function filtered(){
  const st=parseInt(document.getElementById('fStreak').value);
  const a0=parseInt(document.getElementById('fAgeMin').value);
  const a1=parseInt(document.getElementById('fAgeMax').value);
  const g0=parseFloat(document.getElementById('fGainMin').value);
  const g1=parseFloat(document.getElementById('fGainMax').value);
  const volT=document.getElementById('fVolT').classList.contains('on');
  const boxT=document.getElementById('fBoxT').classList.contains('on');
  const key=document.getElementById('fSort').value;
  let rows=mkt().signals.slice();
  if(STATUS==='WINNERS') rows=rows.filter(s=>(s.gain_pct??0)>=WINNER_FLOOR&&(s.age_days??0)>=2&&s.box_today!==false);
  // LOSERS is deliberately every losing signal, not just the FADING ones.
  // FADING is a subset: on US, 29 signals were down money while tagged
  // TRENDING or WATCHING, so no tab in the dashboard ever showed them.
  // The status badge on each row still says which kind it is.
  else if(STATUS==='LOSERS') rows=rows.filter(s=>(s.gain_pct??0)<0&&(s.age_days??0)>=2);
  else if(STATUS==='TODAY') rows=rows.filter(s=>s.status==='TRENDING'&&(s.streak??0)>=2&&s.clean_entry===true);
  else if(STATUS==='LIVE') rows=rows.filter(s=>s.source==='scanner_intraday');
  else if(STATUS!=='ALL') rows=rows.filter(s=>s.status===STATUS);
  if(!isNaN(st)) rows=rows.filter(s=>(s.streak??0)>=st);
  if(!isNaN(a0)) rows=rows.filter(s=>(s.age_days??0)>=a0);
  if(!isNaN(a1)) rows=rows.filter(s=>(s.age_days??1e9)<=a1);
  if(!isNaN(g0)) rows=rows.filter(s=>(s.gain_pct??-1e9)>=g0);
  if(!isNaN(g1)) rows=rows.filter(s=>(s.gain_pct??1e9)<=g1);
  if(volT) rows=rows.filter(s=>s.vol_today===true);
  if(boxT) rows=rows.filter(s=>s.box_today===true);
  rows.sort((a,b)=>{
    const va=a[key]??-Infinity, vb=b[key]??-Infinity;
    return (va<vb?-1:va>vb?1:0)*DIR;
  });
  return rows;
}

function render(){renderStale();renderPrimary();renderTable();renderRegime();renderPositions();renderEdge();renderDetail();}

function edgeVerdict(){
  // The measured verdict for THIS market, in the words of the rule already
  // printed under the edge report: positive 30-day expectancy after 50+
  // signals = edge, anything else = keep paper trading. Rendered next to the
  // candidate because that is where the decision actually gets made -- at the
  // bottom of the page it was true and ignored.
  const d=(mkt().edge||{}).d30;
  if(!d||!d.n) return {kind:'unproven',tag:'UNPROVEN',
    html:'No 30-day outcomes measured for this market yet. <b>Paper only</b> until there are.'};
  if(d.n<50) return {kind:'unproven',tag:'UNPROVEN',
    html:`Only <b>${d.n}</b> measured outcomes here. The bar is 50+ before the number means `+
         `anything, so this is <b>paper only</b> for now.`};
  if(d.avg<=0) return {kind:'paper',tag:'PAPER<br>ONLY',
    html:`This market averages <b>${fmt(d.avg,1)}%</b> over 30 days across <b>${d.n}</b> `+
         `measured signals, hit rate <b>${fmt(d.hit_rate,0)}%</b>. The breakout below is real; `+
         `the expectancy behind it is not. Your own rule says <b>paper</b> until this turns positive.`};
  // Positive is not the same as real. t = avg / (sd/sqrt(n)): below about 2,
  // the average is inside the noise and could just as easily be zero.
  const t=(d.sd&&d.sd>0)?d.avg/(d.sd/Math.sqrt(d.n)):null;
  if(t!=null&&t<2) return {kind:'unproven',tag:'EDGE<br>THIN',
    html:`This market averages <b>+${fmt(d.avg,1)}%</b> over 30 days across <b>${d.n}</b> `+
         `measured signals, hit rate <b>${fmt(d.hit_rate,0)}%</b> — but the spread is `+
         `<b>${fmt(d.sd,0)}%</b>, so that average sits <b>${fmt(t,1)}</b> standard errors from `+
         `zero. Positive, not yet distinguishable from luck. <b>Paper</b> until it separates.`};
  return {kind:'live',tag:'EDGE<br>POSITIVE',
    html:`This market averages <b>+${fmt(d.avg,1)}%</b> over 30 days across <b>${d.n}</b> `+
         `measured signals, hit rate <b>${fmt(d.hit_rate,0)}%</b>`+
         (t!=null?`, <b>${fmt(t,1)}</b> standard errors above zero`:'')+`.`};
}

function renderPrimary(){
  const t=dataDate();
  const todays=mkt().signals.filter(s=>s.scan_date===t&&s.trend_pass)
    .sort((a,b)=>(b.rs_pct??0)-(a.rs_pct??0));
  document.getElementById('pmeta').textContent=
    todays.length?`strongest RS of ${todays.length} qualified in the ${t} scan`:'';
  const el=document.getElementById('primary');
  if(!todays.length){
    // Still show the verdict: it describes the market's measured expectancy,
    // not today's candidate, and a quiet day is exactly when it is worth
    // knowing whether this market is worth trading at all.
    const nv=edgeVerdict();
    el.innerHTML=`<div class="empty">No qualified breakouts in the ${t} scan. No trade is a position.</div>
      <div class="primary" style="margin-top:10px">
        <div class="ptrigger pv-${nv.kind}" style="text-align:left">${nv.tag}</div>
        <div class="pverdict pv-${nv.kind}" style="grid-column:2/-1;border-top:none;margin:0;padding:0">${nv.html}</div>
      </div>`;
    return;
  }
  const s=todays[0], v=edgeVerdict();
  el.innerHTML=`<div class="primary">
    <div class="tick">${s.ticker}<small>${s.scan_date}</small></div>
    <div class="pgrid">
      <div class="stat"><b class="num">${cur()}${fmt(s.price)}</b><span>price</span></div>
      <div class="stat"><b class="num">${cur()}${fmt(s.box_top)}</b><span>box top</span></div>
      <div class="stat"><b class="num">${fmt(s.vol_ratio,1)}×</b><span>volume</span></div>
      <div class="stat"><b class="num acc">${fmt(s.rs_pct,0)}</b><span>rs percentile</span></div>
      <div class="stat"><b class="num down">${cur()}${fmt(s.suggested_stop)}</b><span>stop</span></div>
      <div class="stat"><b class="num">${fmt(s.rr_ratio,1)}</b><span>r : r</span></div>
      <div class="rsmeter"><i style="width:${s.rs_pct??0}%"></i></div>
    </div>
    <div class="ptrigger pv-${v.kind}">${v.tag}</div>
    <div class="pverdict pv-${v.kind}">${v.html}</div>
  </div>`;
}

function dupInfo(){
  // For tickers with multiple signals currently loaded, rank each by
  // scan_date so we can show "2nd of 2" etc — makes it obvious two rows
  // for the same ticker are different historical breakouts, not a glitch.
  const byTicker={};
  for(const s of mkt().signals){
    (byTicker[s.ticker]=byTicker[s.ticker]||[]).push(s);
  }
  const info={};
  for(const t in byTicker){
    const list=byTicker[t];
    if(list.length<2) continue;
    list.sort((a,b)=>a.scan_date<b.scan_date?-1:1);
    list.forEach((s,i)=>{info[s.id]={rank:i+1,total:list.length};});
  }
  return info;
}
function liveBadge(s){
  // Signals written by the mid-session (--intraday) scan. The day's candle
  // isn't closed yet, so the breakout can still fail before 4pm. Flagged so a
  // provisional row is never mistaken for a confirmed one.
  return s.source==='scanner_intraday'
    ? '<span class="bdg b-live" title="Provisional: found mid-session, close not confirmed yet. The EOD scan will confirm it with the real closing price or remove it.">LIVE</span>'
    : '';
}
function dupBadge(s,dups){
  const d=dups[s.id];
  return d?`<span class="bdg b-dup" title="Signal ${d.rank} of ${d.total} for this ticker — a separate breakout at a different price/date, not a duplicate">${d.rank}/${d.total}</span>`:'';
}

const MONTH_ABBR=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function monthLabel(m){
  const p=m.split('-');
  return (MONTH_ABBR[parseInt(p[1],10)-1]||m)+' '+p[0];
}
function toggleGroup(){
  GROUP=!GROUP;
  document.getElementById('fGroup').classList.toggle('on',GROUP);
  renderTable();
}
function toggleMonth(m){
  COLLAPSED.has(m)?COLLAPSED.delete(m):COLLAPSED.add(m);
  renderTable();
}
function groupByMonth(rows){
  // Months newest-first always; the chosen sort key still orders rows WITHIN
  // each month, and the filters have already run -- so the per-month stats
  // describe exactly what is on screen, not the whole market.
  const map=new Map();
  for(const s of rows){
    const m=(s.scan_date||'').slice(0,7);
    if(!map.has(m)) map.set(m,[]);
    map.get(m).push(s);
  }
  return [...map.entries()].sort((a,b)=>a[0]<b[0]?1:a[0]>b[0]?-1:0);
}
function monthStats(list){
  const g=list.map(s=>s.gain_pct).filter(v=>v!=null);
  return {
    n:list.length,
    avg:g.length?g.reduce((a,b)=>a+b,0)/g.length:null,
    hit:g.length?g.filter(v=>v>0).length/g.length*100:null,
  };
}
function retentionEdge(){
  // export_dashboard.py keeps EVERY signal for ~30 days, then keeps only the
  // ones still TRENDING. So the oldest signal that is NOT trending marks the
  // boundary: before it, the losers have already been dropped and what is left
  // is survivors. Averaging across that line is how a month whose real 30-day
  // outcome was -10.2% comes out reading "+18.9%, 100% up".
  //
  // Read off the data rather than hardcoded, so it follows RECENT_DAYS.
  let edge=null;
  for(const s of mkt().signals){
    if(s.status&&s.status!=='TRENDING'&&s.scan_date){
      if(edge===null||s.scan_date<edge) edge=s.scan_date;
    }
  }
  return edge;
}
function cohortKind(m,edge){
  if(!edge) return 'full';
  const em=edge.slice(0,7);
  return m>em?'full':m===em?'partial':'survivors';
}
const SURV_TIP='Only the signals still TRENDING from this month are kept on the '+
  'dashboard - the ones that failed were dropped weeks ago. An average here would '+
  'be the survivors congratulating themselves. The Edge report reads the full '+
  'database and is the honest number for old months.';
const PART_TIP='Part of this month falls before the retention cutoff, so its '+
  'earlier failures have been dropped. These figures lean optimistic.';

function monthHeadInner(m,list,edge){
  const st=monthStats(list), open=!COLLAPSED.has(m);
  const kind=cohortKind(m,edge);
  const cls=st.avg==null?'':st.avg>0?'up':'down';
  let stats='';
  if(kind==='survivors'){
    stats=`<span class="mcold" title="${SURV_TIP}">survivors only · no average</span>`;
  }else{
    stats=(st.avg!=null?`<span class="mstat ${cls}">avg ${(st.avg>0?'+':'')+fmt(st.avg,1)}%</span>`:'')+
          (st.hit!=null?`<span class="mstat">${fmt(st.hit,0)}% up</span>`:'')+
          (kind==='partial'?`<span class="mwarn" title="${PART_TIP}">⚠ partial</span>`:'');
  }
  return `<span class="mchev">${open?'▾':'▸'}</span>`+
    `<span class="mname">${monthLabel(m)}</span>`+
    `<span class="mstat">${st.n} signal${st.n===1?'':'s'}</span>`+stats;
}
function monthHeadRow(m,list,cols,edge){
  return `<tr class="mhdr" onclick="toggleMonth('${m}')"><td colspan="${cols}">${monthHeadInner(m,list,edge)}</td></tr>`;
}
function monthHeadCard(m,list,edge){
  return `<div class="mcard" onclick="toggleMonth('${m}')">${monthHeadInner(m,list,edge)}</div>`;
}

function renderTable(){
  const key=document.getElementById('fSort').value;
  document.getElementById('thead').innerHTML=COLS.map(c=>
    `<th class="${key===c.k?'sorted':''}" onclick="sortBy('${c.k}')">${c.label}${key===c.k?(DIR<0?' ↓':' ↑'):''}</th>`).join('');
  const rows=filtered(), total=mkt().signals.length;
  const trend=mkt().signals.filter(s=>s.status==='TRENDING').length;
  const fade=mkt().signals.filter(s=>s.status==='FADING').length;
  document.getElementById('wmeta').textContent=
    `${total} tracked · ${trend} trending · ${fade} fading`;
  const dups=dupInfo();
  if(GROUP){
    const groups=groupByMonth(rows), edge=retentionEdge();
    document.getElementById('count').textContent=
      `showing ${rows.length} of ${total} · ${groups.length} month${groups.length===1?'':'s'}`;
    let tH='', cH='';
    for(const g of groups){
      tH+=monthHeadRow(g[0],g[1],COLS.length,edge);
      cH+=monthHeadCard(g[0],g[1],edge);
      if(!COLLAPSED.has(g[0])){
        tH+=g[1].map(s=>rowHTML(s,dups)).join('');
        cH+=g[1].map(s=>cardHTML(s,dups)).join('');
      }
    }
    document.getElementById('tbody').innerHTML=tH;
    document.getElementById('cards').innerHTML=cH;
    return;
  }
  document.getElementById('count').textContent=`showing ${rows.length} of ${total}`;
  document.getElementById('tbody').innerHTML=rows.map(s=>rowHTML(s,dups)).join('');
  document.getElementById('cards').innerHTML=rows.map(s=>cardHTML(s,dups)).join('');
}

          (s.clean_entry?`<span class="down">→ ${cur()}${fmt(s.entry_stop_now)}</span> <span class="${riskClass(s.entry_risk_now)}">${fmt(s.entry_risk_now,1)}%</span>`
                        :`<span class="sub" style="font-size:11px">box too wide — no clean entry</span>`)
          :`<span class="down">${cur()}${fmt(s.suggested_stop)}</span>`}</td>

           `Vol <span class="${s.vol_today?'chk':'x'}">${s.vol_today?'✓':'✗'}</span> · Box <span class="${s.box_today?'chk':'x'}">${s.box_today?'✓':'✗'}</span>`}</td>
    </tr>`;

}

function sortBy(k){
  const sel=document.getElementById('fSort');
  if(sel.value===k){flipDir();return;}
  sel.value=k; DIR=-1; document.getElementById('fDir').textContent='↓'; renderTable();
}
function select(id){SELECTED=SELECTED===id?null:id;renderTable();renderDetail();}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&SELECTED!=null)select(SELECTED);});

function streakRuns(v){
  if(!v||v.length<2) return [];
  const runs=[]; let cur=0;
  for(let i=1;i<v.length;i++){
    if(v[i]>v[i-1]) cur++;
    else { if(cur>0) runs.push(cur); cur=0; }
  }
  if(cur>0) runs.push(cur);
  return runs.map((len,i)=>({len, active:i===runs.length-1 && v[v.length-1]>v[v.length-2]}));
}

function spark(s){
  const v=s.spark;
  if(!v||v.length<2) return '<div class="sub" style="padding:8px 0">not enough history for chart</div>';
  const W=560,H=130,P=8,LH=11;
  const stop=s.entry_stop_now??s.suggested_stop;
  const refs=[s.box_top,s.box_bottom,stop].filter(x=>x!=null);
  const lo=Math.min(...v,...refs),hi=Math.max(...v,...refs),rng=(hi-lo)||1;
  const X=i=>P+i*(W-2*P)/(v.length-1);
  const Y=p=>H-P-(p-lo)*(H-2*P)/rng;
  const path=v.map((p,i)=>`${i?'L':'M'}${X(i).toFixed(1)},${Y(p).toFixed(1)}`).join('');
  const items=[[s.box_top,'sbox','box top'],[s.box_bottom,'sbox','box low'],[stop,'sstop','stop']]
    .filter(x=>x[0]!=null).map(([p,cls,lbl])=>({p,cls,lbl,ly:Y(p)-3}))
    .sort((a,b)=>a.ly-b.ly);
  for(let i=1;i<items.length;i++)
    if(items[i].ly-items[i-1].ly<LH) items[i].ly=items[i-1].ly+LH;
  for(let i=items.length-1;i>=0;i--){
    if(items[i].ly>H-3) items[i].ly=H-3;
    if(i<items.length-1&&items[i+1].ly-items[i].ly<LH) items[i].ly=items[i+1].ly-LH;
  }
  // Reference LINES go under the price path; reference LABELS go over it, each
  // on its own backing rect. Before this, everything was emitted ahead of the
  // path, so on a big winner (price far above the signal-time box) the green
  // line ran straight through "stop $127.77" and made it unreadable.
  const refLines=items.map(o=>
    `<line x1="${P}" x2="${W-P}" y1="${Y(o.p).toFixed(1)}" y2="${Y(o.p).toFixed(1)}" class="sl ${o.cls}"/>`).join('');
  const CW=5.4;   // ~width of one 9px monospace char in viewBox units
  const refLabels=items.map(o=>{
    const txt=`${o.lbl} ${cur()}${fmt(o.p)}`;
    const w=txt.length*CW+6;
    return `<rect x="${(W-P-w).toFixed(1)}" y="${(o.ly-8).toFixed(1)}" width="${w.toFixed(1)}" height="10.5" class="sltbg"/>`+
           `<text x="${(W-P-3).toFixed(1)}" y="${o.ly.toFixed(1)}" text-anchor="end" class="slt ${o.cls}">${txt}</text>`;
  }).join('');
  const up=v[v.length-1]>=v[0];
  return `<svg viewBox="0 0 ${W} ${H}" class="spark" preserveAspectRatio="none">
    ${refLines}
    <path d="${path}" class="sline ${up?'up':'down'}"/>
    <circle cx="${X(v.length-1).toFixed(1)}" cy="${Y(v[v.length-1]).toFixed(1)}" r="3" class="sdot ${up?'up':'down'}"/>
    ${refLabels}
  </svg>`;
}

function entryPlanner(s, acct){
  // "If I buy TODAY, where does the stop go?" — two defensible answers,
  // shown side by side so the choice is explicit per trade.
  //
  //   TIGHT (classic Darvas): just under the CURRENT BOX TOP. Darvas's own
  //     rule after a breakout was that the broken box top becomes the floor;
  //     falling back inside the box = exit. Only valid when price is actually
  //     ABOVE the box — otherwise this "stop" sits above the price, which is
  //     not a stop at all, so it's suppressed in that case.
  //   FULL BOX (what the system flags/filters on): under the box BOTTOM.
  //     Survives a dip back into the box; wider risk. This is the one every
  //     measured stat (53-56% stop-hit rate) was earned on.
  //
  // Display only — no filter, no scoring, no change to Today-tab behaviour.
  const now=s.now_price, top=s.box_top_now, bot=s.box_bottom_now;
  if(now==null||top==null||bot==null)
    return '<div class="plan"><div class="plan-h">If entering today</div><div class="sub">No current box — not enough recent data to place an entry stop.</div></div>';

  const rows=[];
  const mk=(name,stop,note)=>{
    if(stop==null||stop>=now) return null;
    const risk=(now-stop)/now*100;
    const shares=acct?Math.floor((acct*0.02)/(now-stop)):null;
    return {name,stop,risk,shares,note};
  };
  const tight=(s.box_pos==='above')?mk('Tight — under box top',+(top*0.98).toFixed(2),
      'Classic Darvas: broken box top is the new floor. Smaller loss when wrong, but stops out more often — dips back into the box are common.')
    :null;
  const full=mk('Full box — under box bottom',+(bot*0.98).toFixed(2),
      'Survives a pullback into the box. Wider risk. All measured stats use this one.');

  if(tight) rows.push(tight);
  if(full) rows.push(full);
  if(!rows.length)
    return `<div class="plan"><div class="plan-h">If entering today</div><div class="sub">Price (${cur()}${fmt(now)}) is at or below the box bottom — no valid stop below current price. Not an entry.</div></div>`;

  const body=rows.map(r=>`
    <div class="plan-row">
      <div class="plan-name">${r.name}</div>
      <div class="plan-nums">
        <b class="down">${cur()}${fmt(r.stop)}</b>
        <span class="${riskClass(r.risk)}">${fmt(r.risk,1)}% risk</span>
        <span class="sub">${r.shares!=null?`${r.shares} shares @2%`:'set account size'}</span>
      </div>
      <div class="sub plan-note">${r.note}</div>
    </div>`).join('');

  const posNote = s.box_pos==='above'
    ? ''
    : `<div class="sub plan-note">Price is ${String(s.box_pos||'').toUpperCase()} the box, so the tight stop doesn't apply — it would sit above today's price.</div>`;

  return `<div class="plan">
    <div class="plan-h">If entering today at ${cur()}${fmt(now)} · box ${cur()}${fmt(bot)}–${fmt(top)}</div>
    ${body}${posNote}
  </div>`;
}

function renderDetail(){
  const el=document.getElementById('detail');
  const bk=document.getElementById('dback');
  const s=mkt().signals.find(x=>x.id===SELECTED);
  if(!s){el.classList.remove('on');bk.classList.remove('on');return;}
  const acct=ACCOUNT[MARKET];
  const riskAmt=acct?acct*0.02:null;
  const liveStop=s.clean_entry?s.entry_stop_now:s.suggested_stop;
  const perShare=s.price-(liveStop||s.price);
  const maxShares=(acct&&perShare>0)?Math.floor(riskAmt/perShare):0;
  const yq=MARKET==='IN'?s.ticker+'.NS':MARKET==='CA'?s.ticker+'.TO':s.ticker;

  const tvSymbol=MARKET==='IN'?'NSE:'+s.ticker:MARKET==='CA'?'TSX:'+s.ticker:s.ticker;
  el.classList.add('on');bk.classList.add('on');
  el.innerHTML=`<button class="dclose" onclick="select(SELECTED)">✕</button>
    <h3>${s.ticker}<em>${s.scan_date} · ${(s.source||'').replace('migration_','legacy ')}</em></h3>
    ${spark(s)}
    ${(()=>{const runs=streakRuns(s.spark);
      if(!runs.length) return '';
      const heat=l=>l>=4?' h4':l>=2?' h2':'';
      const chips=runs.map(r=>`<span class="schip${r.active?' on':''}${heat(r.len)}">${r.len}d${r.active?' current':''}</span>`).join('');
      const note=(s.age_days??0)>60?' <span class="sub">(last 60 sessions tracked)</span>':'';
      return `<div class="shist">${chips}</div><div class="sub" style="margin:-10px 0 16px">streak history — each run resets on a lower close${note}</div>`;
    })()}
    <div class="dgrid">
      <div class="stat"><b class="num">${cur()}${fmt(s.price)} → ${s.now_price!=null?cur()+fmt(s.now_price):'—'}</b><span>breakout → now</span></div>
      <div class="stat"><b class="num ${s.gain_pct>0?'up':s.gain_pct<0?'down':''}">${s.gain_pct!=null?(s.gain_pct>0?'+':'')+fmt(s.gain_pct,1)+'%':'—'}</b><span>gain since alert</span></div>
      <div class="stat"><b class="num ${s.max_gain_pct>0?'up':''}">${s.max_gain_pct!=null?(s.max_gain_pct>0?'+':'')+fmt(s.max_gain_pct,1)+'%':'—'}</b><span>max gain reached</span></div>
      <div class="stat"><b class="num ${s.max_dd_pct<0?'down':''}">${s.max_dd_pct!=null?fmt(s.max_dd_pct,1)+'%':'—'}</b><span>worst point</span></div>
      <div class="stat"><b class="num">${cur()}${fmt(s.box_bottom)}–${fmt(s.box_top)}</b><span>darvas box</span></div>
      <div class="stat"><b class="num">${fmt(s.vol_ratio,1)}×</b><span>vol at breakout</span></div>
      <div class="stat"><b class="num acc">${s.rs_pct!=null?fmt(s.rs_pct,0):'—'}</b><span>rs percentile</span></div>
      <div class="stat"><b class="num">${s.rs_excess!=null?fmt(s.rs_excess,1)+'pp':'—'}</b><span>vs benchmark 63d</span></div>
      <div class="stat"><b class="num down">${s.clean_entry?cur()+fmt(s.entry_stop_now):cur()+fmt(s.suggested_stop)}</b><span>stop today${s.clean_entry?` · risk <b class="${riskClass(s.entry_risk_now)}">${fmt(s.entry_risk_now,1)}%</b>`:' (box too wide)'}</span></div>
      <div class="stat"><b class="num">${cur()}${fmt(s.suggested_stop)}</b><span>stop @ signal · risk ${fmt(s.risk_pct,1)}%</span></div>
      <div class="stat"><b class="num">${s.streak!=null?s.streak+' (peak '+s.peak_streak+')':'—'}</b><span>up-day streak</span></div>
      <div class="stat"><b class="num">${s.ret_d30!=null?fmt(s.ret_d30,1)+'%':'pending'}</b><span>outcome 30d</span></div>
      <div class="stat wide"><b class="num">${s.trend_detail||'legacy — not gated'}</b><span>trend gate</span></div>
    </div>
    ${entryPlanner(s, acct)}
    <div class="sizing">${acct?`2% rule @ ${cur()}${acct.toLocaleString()} → max loss ${cur()}${riskAmt.toFixed(0)}
      → <b>max ${maxShares} shares</b> at this stop. These numbers must match the journal.`
      :`Position sizing not set up for ${MARKET} yet — add an account value to ACCOUNT in dashboard.html to enable the 2% rule calculator here.`}</div>
    <div class="links">
      ${ref}
      <a href="https://finance.yahoo.com/quote/${yq}" target="_blank">Yahoo</a>
      <a href="https://www.tradingview.com/chart/?symbol=${tvSymbol}" target="_blank">TradingView</a>
    </div>`;
}

function tradingDaysBetween(a,b){
  // Weekends are not missed scans, so count weekdays only. Holidays still
  // read as one stale day, which is the safe direction to be wrong in.
  let d=new Date(a+'T00:00:00Z'); const end=new Date(b+'T00:00:00Z'); let n=0;
  while(d<end){
    d.setUTCDate(d.getUTCDate()+1);
    const w=d.getUTCDay();
    if(w!==0&&w!==6) n++;
  }
  return n;
}
function renderStale(){
  // A market that stopped scanning looks exactly like a market with no
  // breakouts: a full table of old signals and a regime read. This is the
  // difference between "quiet" and "broken".
  const el=document.getElementById('stale');
  const last=mkt().last_scan, gen=dataDate();
  if(!last||!gen){el.innerHTML='';return;}
  const n=tradingDaysBetween(last,gen);
  if(n<2){el.innerHTML='';return;}
  const bad=n>=4;
  el.innerHTML=`<div class="stale ${bad?'stale-bad':'stale-warn'}">
    <span>⚠</span>
    <span>Last ${mkt().label} scan was <b>${last}</b> — <b>${n} trading days</b> ago.
    Everything below is from that run, not today. Check the workflow before trusting it.</span>
  </div>`;
}

function renderRegime(){
  const el=document.getElementById('regime');
  const r=mkt().regime;
  if(!r||!r.label){el.innerHTML='';return;}
  const cls={'RISK-ON':'rgm-on','MIXED':'rgm-mid','RISK-OFF':'rgm-off'}[r.label]||'rgm-unk';
  const note={
    'RISK-ON' :'Index above its 50 & 200-day averages — the backdrop breakouts do best in.',
    'MIXED'   :'Index is between its averages. Breakouts still fire, but more of them fail.',
    'RISK-OFF':'Index below its own averages. In this repo\u2019s own data, breakout months like this averaged deeply negative 30-day returns. Consider smaller size or sitting out.',
    'UNKNOWN' :'Index data unavailable this run — no regime read.'
  }[r.label]||'';
  const pct=r.pct_from_200ma!=null?` <span class="sub">(${r.pct_from_200ma>0?'+':''}${fmt(r.pct_from_200ma,1)}% vs 200-day)</span>`:'';
  el.innerHTML=`<div class="rgm">
    <span class="rgm-tag ${cls}">${r.label}</span>
    <span class="rgm-txt">${note}${pct}</span>
  </div>`;
}

function renderPositions(){
  const el=document.getElementById('positions');
  const pos=mkt().positions;
  if(!pos.length){el.innerHTML='<div class="empty">No open positions. Cash is a position too.</div>';return;}
  el.innerHTML=pos.map(p=>{
    const pl=p.pl_amount, plp=p.pl_pct, cls=pl>0?'up':pl<0?'down':'';
    return `<div class="pos">
      <div class="t" style="display:flex;justify-content:space-between;align-items:baseline">
        <span>${p.ticker}</span>
        <span class="num ${cls}" style="font-size:15px">${pl!=null?(pl<0?'-':'+')+cur()+Math.abs(pl).toFixed(2):'—'}</span></div>
      ${plp!=null?`<div class="row"><span>return</span><b class="num ${cls}">${(plp>0?'+':'')+fmt(plp,1)}%</b></div>`:''}
      <div class="row"><span>now</span><b class="num">${p.now_price!=null?cur()+fmt(p.now_price):'—'}</b></div>
      <div class="row"><span>shares</span><b class="num">${p.shares}</b></div>
      <div class="row"><span>entry</span><b class="num">${cur()}${fmt(p.entry_price)} · ${p.entry_date}</b></div>
      <div class="row"><span>${p.stop_moved?'trailing stop':'initial stop'}</span><b class="num acc">${cur()}${fmt(p.current_stop??p.initial_stop)}${p.stop_moved?' \u2191':''}</b></div>
    </div>`;
  }).join('');
}

function renderEdge(){
  const el=document.getElementById('edge');
  const e=mkt().edge;
  if(!e||!e.n_signals){
    el.innerHTML='<div class="empty">No measured outcomes yet. The analyzer backfills 7/14/30-day returns as signals age — the edge report builds itself from here.</div>';return;
  }
  const c=(v,s,cls='')=>`<div class="cell"><b class="num ${cls}">${v}</b><span>${s}</span></div>`;
  el.innerHTML=`<div class="edge">
    ${c(e.n_signals,'signals measured')}
    ${e.d7 ?c(e.d7.hit_rate+'%','hit rate · 7d',e.d7.hit_rate>=50?'up':'down'):''}
    ${e.d30?c(e.d30.hit_rate+'%','hit rate · 30d',e.d30.hit_rate>=50?'up':'down'):''}
    ${e.d30?c((e.d30.avg>0?'+':'')+fmt(e.d30.avg,1)+'%','avg return · 30d',e.d30.avg>0?'up':'down'):''}
    ${e.d30?c((e.d30.median>0?'+':'')+fmt(e.d30.median,1)+'%','median · 30d',e.d30.median>0?'up':'down'):''}
    ${e.stop_hit_rate!=null?c(e.stop_hit_rate+'%','stops hit · 30d',e.stop_hit_rate>40?'down':''):''}
  </div>
  <div class="note">Positive 30-day expectancy after 50+ signals = edge. Anything else = keep paper trading.</div>
  ${monthEdgeHTML()}`;
}

function monthEdgeHTML(){
  // Straight from the db via cohorts(), NOT from the signals on this page.
  // The dashboard drops everything over 30 days old unless it is still
  // TRENDING, so an average taken from what is on screen would be the
  // survivors grading themselves. These are every signal that ever fired.
  const co=mkt().cohorts;
  if(!co||!co.by_month||!co.by_month.length) return '';
  const rows=co.by_month.slice().reverse().map(m=>{
    const gate=m.gated==='mixed'
      ? '<span class="gate-mixed" title="The trend gate went live partway through this month, so these signals are not all screened the same way.">MIXED</span>'
      : m.gated==='none' ? '<span class="gate-none">UNGATED</span>'
      : '<span class="gate-all">gated</span>';
    if(!m.measured) return `<tr class="pend">
      <td>${monthLabel(m.month)}</td><td>${m.n}</td>
      <td colspan="3">still maturing — no 30-day number yet</td><td>${gate}</td></tr>`;
    const a=m.avg_d30;
    return `<tr>
      <td>${monthLabel(m.month)}</td>
      <td>${m.measured}${m.measured<m.n?`<span class="sub"> / ${m.n}</span>`:''}</td>
      <td class="${a>0?'up':a<0?'down':''}">${(a>0?'+':'')+fmt(a,1)}%</td>
      <td>${fmt(m.hit_d30,0)}%</td>
      <td>${m.stop_hit!=null?fmt(m.stop_hit,0)+'%':'—'}</td>
      <td>${gate}</td></tr>`;
  }).join('');
  const p=co.pending;
  const pendNote=p&&p.n
    ? `<div class="note"><b class="acc">${p.n} signals still maturing</b> · the whole batch is `+
      `readable on <b class="acc">${p.all_mature}</b>. That is the next real verdict for this market.`+
      (p.unmeasured?` · ${p.unmeasured} older signal${p.unmeasured===1?'':'s'} never got priced `+
       `(delisted or fetch failure) and will not resolve.`:'')+`</div>`
    : '';
  return `<div class="mwrap"><table class="mtbl">
    <thead><tr><th>Month</th><th>Measured</th><th>Avg 30d</th><th>Hit</th><th>Stops hit</th><th>Gate</th></tr></thead>
    <tbody>${rows}</tbody></table></div>${pendNote}`;
}
