name: ASR maintenance

# Jobs that are too slow or too network-heavy to belong in the daily scan.
#
#   stop_study       replays every closed signal against alternative stop
#                    levels. Needs price history for CLOSED signals, which the
#                    export deliberately no longer downloads. Weekly is ample:
#                    it is a slow-moving statistic and running it daily would
#                    re-fetch several hundred tickers to move a number by a
#                    tenth of a point.
#
#   backfill_company sector / industry / company_name for signals fired before
#                    the per-signal lookup existed (~498 US tickers). One
#                    throttled request each, so ~12 minutes. Resumable: it
#                    commits per ticker and re-running continues where it
#                    stopped, so a timeout costs nothing.
#
# Shares the `scanner` concurrency group, because both this and the scan
# commit the database and push -- overlapping them would mean a push race.
on:
  schedule:
    - cron: "40 22 * * 6"     # Saturday, well clear of every scan window
  workflow_dispatch:
    inputs:
      task:
        description: "which job to run"
        type: choice
        default: stop_study
        options: [stop_study, backfill_company, both, recompute]
      market:
        description: "market key for the backfill"
        default: US
      limit:
        description: "max tickers to backfill (0 = all)"
        default: "0"

concurrency:
  group: scanner
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }

      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: "pip" }

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Work and publish in ONE step, retrying on a fresh base.
      #
      # data/asr.db is a binary SQLite file: git cannot merge it, ever. An
      # earlier version of this job ran `git pull --rebase` before pushing,
      # which meant that the moment any other run committed, the rebase hit an
      # unmergeable conflict and the whole job died with its work discarded.
      # Resolving that conflict is not possible either -- neither side's
      # database is a superset of the other, so picking one silently drops the
      # other's rows.
      #
      # So no merge ever happens here. If origin moved while we worked, we
      # throw our result away, reset onto the newer database, and redo the
      # work on top of it. Both jobs are idempotent -- the backfill only fills
      # NULL columns and the stop study recomputes from scratch -- so redoing
      # them against a newer db produces exactly the right combined result.
      - name: Run maintenance and publish
        env:
          TASK:   ${{ inputs.task || 'stop_study' }}
          MARKET: ${{ inputs.market || 'US' }}
          LIMIT:  ${{ inputs.limit || '0' }}
        run: |
          git config user.name  "asr-bot"
          git config user.email "actions@github.com"

          for attempt in 1 2 3; do
            echo "::group::attempt $attempt"
            git fetch -q origin
            # Always build on the newest committed database, discarding
            # anything a previous attempt produced.
            git reset --hard -q origin/main

            if [ "$TASK" = "recompute" ]; then
              # Closes are sticky on purpose: _apply_lifecycle skips a signal
              # that already carries a close_reason, so a corrected walk would
              # never revisit verdicts an earlier one wrote. Clearing them is
              # what lets the fixed logic re-decide. The export must then run
              # BEFORE the study, because the study reads closed signals and
              # there are none until the export re-creates them.
              python reset_closes.py
              python export_dashboard.py
              python run_stop_study.py
            else
              if [ "$TASK" = "stop_study" ] || [ "$TASK" = "both" ]; then
                python run_stop_study.py
              fi
              if [ "$TASK" = "backfill_company" ] || [ "$TASK" = "both" ]; then
                python backfill_company.py --market "$MARKET" --limit "$LIMIT"
              fi
            fi
            # The study lands in the db; the export is what copies it into
            # data.json for the dashboard, and what writes history.json.
            python export_dashboard.py

            git add data/asr.db data.json history.json
            if git diff --cached --quiet; then
              echo "No changes."; echo "::endgroup::"; exit 0
            fi
            git commit -q -m "maintenance $(date -u +'%Y-%m-%d %H:%M UTC')"

            if git push -q origin HEAD:main; then
              echo "pushed $(git rev-parse --short HEAD)"
              echo "::endgroup::"; exit 0
            fi
            echo "push rejected — origin advanced while this ran; redoing on the new base"
            echo "::endgroup::"
          done

          echo "::error::could not publish after 3 attempts; re-run when no scan is in flight"
          exit 1
