name: AlluSkyRocketStocks v2

# Two runs per US/CA day plus one for India.
#   19:00 UTC — noon PT (PDT). US/TSX still OPEN (3pm ET, ~1h before close).
#               Runs with --intraday: signals are PROVISIONAL and get replaced
#               or deleted by the EOD run below. This is the "act during the
#               session" alert, not the record of truth.
#   21:15 UTC — after the US/TSX close. The confirming run; this is what every
#               measured edge stat is built from.
#   10:30 UTC — 4:00pm IST, after the NSE close.
# NOTE: GitHub cron is fixed UTC and does NOT follow daylight saving, so the
# 19:00 run is noon PT in summer and 11am PT in winter. Both are mid-session,
# so the intraday behaviour is unaffected either way.
on:
  schedule:
    - cron: "0 19 * * 1-5"    # 19:00 UTC = noon PT — US/CA INTRADAY (provisional)
    - cron: "15 21 * * 1-5"   # 21:15 UTC = after US close — US/CA confirming run
    - cron: "30 10 * * 1-5"   # 10:30 UTC = 4:00pm IST, after NSE close
  workflow_dispatch:

concurrency:
  group: scanner
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }

      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: "pip" }

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Decide market from trigger time
        id: mkt
        run: |
          HOUR=$(date -u +%H)
          # Only the 19:00 UTC cron is the mid-session run. Detect it by the
          # schedule string itself rather than hour math, so it can't drift.
          if [ "${{ github.event.schedule }}" = "0 19 * * 1-5" ]; then
            echo "intraday=--intraday" >> "$GITHUB_OUTPUT"
            echo "markets=US CA" >> "$GITHUB_OUTPUT"
          else
            echo "intraday=" >> "$GITHUB_OUTPUT"
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "markets=US IN CA" >> "$GITHUB_OUTPUT"   # manual run does all three
            elif [ "$HOUR" -ge 15 ]; then
              echo "markets=US CA" >> "$GITHUB_OUTPUT"   # TSX closes same time as US (4pm ET)
            else
              echo "markets=IN" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Scan
        run: |
          for m in ${{ steps.mkt.outputs.markets }}; do
            python scanner.py "$m" ${{ steps.mkt.outputs.intraday }}
            python analyzer.py "$m"
          done

      - name: Export dashboard payload
        run: python export_dashboard.py

      - name: Telegram digest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python telegram_digest.py || echo "digest failed (non-fatal)"

      - name: Commit results
        run: |
          git config user.name  "asr-bot"
          git config user.email "actions@github.com"
          git add data/asr.db data.json
          if ! git diff --cached --quiet; then
            git commit -m "scan $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          else
            echo "No changes."
          fi
