name: AlluSkyRocketStocks v2

# Two runs per US/CA day plus one for India.
#   19:00 UTC — noon PT (PDT). US/TSX still OPEN (3pm ET, ~1h before close).
#               Runs with --intraday: signals are PROVISIONAL and get replaced
#               or deleted by the EOD run below. This is the "act during the
#               session" alert, not the record of truth.
#   21:15 UTC — after the US/TSX close. The confirming run; this is what every
#               measured edge stat is built from.
#   10:30 UTC — 4:00pm IST, after the NSE close.
# NOTE: GitHub cron is fixed UTC and does NOT follow daylight saving, so the
# 19:00 run is noon PT in summer and 11am PT in winter. Both are mid-session,
# so the intraday behaviour is unaffected either way.
on:
  schedule:
    - cron: "0 19 * * 1-5"    # 19:00 UTC = noon PT — US/CA INTRADAY (provisional)
    - cron: "30 21 * * 1-5"   # 21:30 UTC = 17:30 ET (EDT) / 16:30 ET (EST) —
                              # the POST-CLOSE run: final daily bars, run_type
                              # "close". Was 21:15; moved so the EST half of
                              # the year lands on 16:30 rather than 16:15,
                              # giving the daily bar time to settle.
    - cron: "30 10 * * 1-5"   # 10:30 UTC = 4:00pm IST, after NSE close
  workflow_dispatch:

concurrency:
  group: scanner
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    # Raised from 25: a rejected push can now redo the scan on a fresh base,
    # and a redo must fit inside the budget rather than being killed halfway.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }

      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: "pip" }

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Decide market from the schedule that fired
        id: mkt
        run: |
          # Routed by the SCHEDULE STRING, never by the clock.
          #
          # GitHub runs scheduled workflows late -- 2.5 to 5 hours late on this
          # repo, every day. The old code special-cased the 19:00 cron by its
          # schedule string and then fell back to hour math for the rest, so
          # the delay silently rerouted everything:
          #
          #   10:30 India cron fired ~15:30 -> HOUR>=15 -> scanned US/CA as a
          #     "close" run, at 11:30am ET, with the US market still OPEN;
          #   19:00 US intraday cron fired ~22:00 -> ran "intraday" two hours
          #     AFTER the close;
          #   21:30 US close cron fired ~00:05 -> HOUR<15 -> scanned India.
          #
          # India got the US close slot, the US close run happened mid-session,
          # and the intraday run happened post-close. Each cron now states its
          # own market and mode, so a late start changes when it runs and
          # nothing else.
          case "${{ github.event.schedule }}" in
            "0 19 * * 1-5")   M="US CA"; I="--intraday" ;;   # mid-session US/CA
            "30 21 * * 1-5")  M="US CA"; I="" ;;             # after the US/CA close
            "30 10 * * 1-5")  M="IN";    I="" ;;             # after the NSE close
            *)                M="US IN CA"; I="" ;;          # manual run: all three
          esac
          echo "markets=$M" >> "$GITHUB_OUTPUT"
          echo "intraday=$I" >> "$GITHUB_OUTPUT"
          echo "routing: schedule='${{ github.event.schedule }}' -> markets=$M intraday='$I'"

      # Tips land BEFORE the scan so a ticker mentioned overnight is in the
      # universe this run rather than next. Non-fatal on purpose: a Discord
      # outage must not stop the scanner from doing its own job.
      - name: Ingest mentions
        if: ${{ vars.DISCORD_CHANNEL_ID != '' }}
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: |
          for m in ${{ steps.mkt.outputs.markets }}; do
            python ingest_mentions.py discord "$m" \
              --channel "${{ vars.DISCORD_CHANNEL_ID }}" --hours 24 \
              || echo "mention ingest failed for $m (non-fatal)"
          done

      # Scan and publish in one step, so a rejected push can be retried with
      # the work redone rather than thrown away.
      #
      # This used to be scan / export / commit as separate steps ending in a
      # bare `git push`. When anything else pushed while a scan was running --
      # a code change, the maintenance job, the other market's cron -- the push
      # was rejected and the whole scan was lost with it, which is what
      # happened on 2026-10-20 00:51 UTC.
      #
      # `git pull --rebase` is not the fix: data/asr.db is a binary SQLite file
      # that git cannot merge, so a rebase conflicts the moment another run has
      # also written it. But when origin moved for a CODE change the database
      # is untouched on both sides and the rebase is clean, which is the common
      # case and cheap. So: try the rebase, and only redo the scan when it
      # genuinely conflicts.
      - name: Scan, export and publish
        run: |
          git config user.name  "asr-bot"
          git config user.email "actions@github.com"

          run_pipeline() {
            for m in ${{ steps.mkt.outputs.markets }}; do
              python scanner.py "$m" ${{ steps.mkt.outputs.intraday }}
              python analyzer.py "$m"
            done
            python export_dashboard.py
          }

          stage_and_commit() {
            # history.json is published beside data.json at the same Pages
            # path. Leaving it out is how the Closed tab stays empty forever:
            # the export writes the file, nothing ever ships it.
            git add data/asr.db data.json history.json
            if git diff --cached --quiet; then
              echo "No changes."
              return 1
            fi
            git commit -q -m "scan $(date -u +'%Y-%m-%d %H:%M UTC')"
            return 0
          }

          run_pipeline
          stage_and_commit || exit 0

          for attempt in 1 2 3; do
            if git push -q origin HEAD:main; then
              echo "pushed $(git rev-parse --short HEAD)"
              exit 0
            fi
            echo "::warning::push rejected (attempt $attempt) — origin moved while this ran"
            git fetch -q origin
            if git rebase -q origin/main; then
              echo "  rebased cleanly onto $(git rev-parse --short origin/main) — retrying push"
              continue
            fi
            git rebase --abort || true
            echo "  rebase conflicted: another run also wrote the database."
            echo "  redoing the scan on top of $(git rev-parse --short origin/main)"
            git reset --hard -q origin/main
            run_pipeline
            stage_and_commit || exit 0
          done

          echo "::error::could not publish after 3 attempts"
          exit 1

      # After publishing, so a retry cannot send the digest twice.
      - name: Telegram digest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python telegram_digest.py || echo "digest failed (non-fatal)"
